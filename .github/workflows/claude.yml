# The website agent.
# The agent is called Sonorus. Write "Sonorus" (no @) in an issue, a pull request comment or a
# review, and it does the work:
# it reads AGENTS.md + DESIGN.md, makes the change on a branch and opens a pull request.
# Only people with write access to this repo can trigger it (enforced by the action).
# It also refuses to work on any thread that has text from someone without write access
# (step "Solo texto de confianza"), so a stranger can't slip hidden instructions to it.
# It can never merge: main is protected, a human approves every pull request.
name: Agente

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

concurrency:
  group: agente-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      github.actor != 'claude[bot]' && (
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, 'sonorus')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, 'sonorus')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, 'sonorus')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, 'sonorus') || contains(github.event.issue.title, 'sonorus'))))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      # Safety: the agent reads the whole thread (issue or PR, title, body, every comment and
      # review). If any of it was written by someone without write access to this repo, stop
      # before the agent starts, so hidden instructions from strangers never reach it.
      - name: Solo texto de confianza
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUM: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          pick='{login: .user.login, assoc: .author_association}'
          people=$(
            gh api "repos/$REPO/issues/$NUM" --jq "$pick"
            gh api --paginate "repos/$REPO/issues/$NUM/comments" --jq ".[] | $pick"
            if gh api "repos/$REPO/pulls/$NUM" > /dev/null 2>&1; then
              gh api --paginate "repos/$REPO/pulls/$NUM/comments" --jq ".[] | $pick"
              gh api --paginate "repos/$REPO/pulls/$NUM/reviews" --jq ".[] | $pick"
            fi
          )
          strangers=$(echo "$people" | jq -rs '
            [ .[]
              | select((.assoc | IN("OWNER", "MEMBER", "COLLABORATOR")) | not)
              | select((.login | IN("claude[bot]", "github-actions[bot]")) | not)
              | .login ] | unique | join(", ")')
          if [ -n "$strangers" ]; then
            echo "Untrusted authors in this thread: $strangers"
            msg="🔒 Sonorus no trabaja en este hilo porque tiene texto de personas sin acceso al repositorio (\`$strangers\`). Por seguridad, abre un issue nuevo escrito por ti con lo que necesitas."
            gh issue comment "$NUM" -R "$REPO" --body "$(printf '%s\n\n— Sonorus 🤖' "$msg")"
            exit 1
          fi

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Not "@sonorus": that's someone else's GitHub account. Matching ignores capitals.
          trigger_phrase: Sonorus
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 30
            --allowedTools "Edit,Read,Write,Glob,Grep,Bash(npm run build),Bash(npm run lint),Bash(npm run format),Bash(npx prettier:*),Bash(git status),Bash(git diff:*),Bash(git log:*),Bash(ls:*),Bash(gh pr create:*),Bash(gh pr list --head:*),Bash(gh pr edit:*),Bash(gh issue edit:*)"
