# Builds the site and publishes it to Hostinger (https://hackersfounders.mx) over FTPS.
# Runs when something is merged into main, every night (so past events move to
# "Anteriores" on their own), and on demand from the Actions tab.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "5 7 * * *" # 00:05 in Hermosillo (UTC-7)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Fail closed, before any FTP connection, unless the target is the absolute docroot.
      # The deploy action removes obsolete folders by "/" + server-dir + folder.
      - name: Check deploy target
        env:
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          case "$FTP_SERVER_DIR" in
            /public_html/|/public_html/*/) echo "Deploy target check passed." ;;
            *) echo "::error::FTP_SERVER_DIR must be /public_html/ or /public_html/<folder>/ (absolute, trailing slash)."; exit 1 ;;
          esac

      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://hackersfounders.mx
          BASE_PATH: /

      - name: FTP deploy
        # v4.4.0, pinned by commit.
        uses: SamKirkland/FTP-Deploy-Action@110f9186c050f71550953127052e77650219c287
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          protocol: ftps
          port: 21
          dangerous-clean-slate: false
